<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="ui-sans-serif,'Noto Sans SC',sans-serif">
  <!-- 浅色页用 · 纯 SiO2 的本征吸收边量级，不等同普通窗玻璃 UVB 截止 -->
  <g fill="#0a1f3d">
    <path d="M130 500V90M120 108L130 88L140 108M130 500H700" fill="none" stroke="#0a1f3d" stroke-width="3"/>
    <text x="80" y="70" font-size="20">光子能量 / eV</text>
    <text x="90" y="505" font-size="20">0</text>
    <rect x="250" y="376" width="210" height="52" fill="#0a1f3d" opacity=".18"/>
    <text x="355" y="350" text-anchor="middle" font-size="24" font-weight="700">可见光 1.8–3.1 eV</text>
    <text x="355" y="458" text-anchor="middle" font-size="20">远低于本征吸收边</text>
    <rect x="200" y="140" width="450" height="40" fill="#0a1f3d" opacity=".28"/>
    <text x="425" y="120" text-anchor="middle" font-size="24" font-weight="700">纯 SiO₂ 吸收边约 8–9 eV</text>
    <text x="425" y="216" text-anchor="middle" font-size="20">已在真空紫外波段</text>
    <text x="400" y="555" text-anchor="middle" font-size="18">窗玻璃含其他组分，UV 截止不能直接套用此数值</text>
  </g>
</svg>
