<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="ui-sans-serif,'Noto Sans SC',sans-serif">
  <!-- 深色页用 · 黄灯过短形成两难区 -->
  <g fill="none" stroke-linecap="round">
    <!-- 路面与停车线 -->
    <line x1="80" y1="400" x2="720" y2="400" stroke="#f1f3f5" stroke-width="3"/>
    <line x1="480" y1="340" x2="480" y2="460" stroke="#f1f3f5" stroke-width="4"/>
    <text x="480" y="500" fill="#f1f3f5" font-size="19" text-anchor="middle" opacity=".85">停车线</text>
    <text x="120" y="500" fill="#f1f3f5" font-size="19" opacity=".85">车流方向 →</text>
    <!-- 两难区带 -->
    <rect x="300" y="330" width="170" height="140" fill="rgba(217,142,95,.22)" stroke="#d98e5f" stroke-width="2.5" stroke-dasharray="9 7"/>
    <text x="385" y="310" fill="#d98e5f" font-size="21" text-anchor="middle" font-weight="700">两难区</text>
    <text x="385" y="430" fill="#d98e5f" font-size="17" text-anchor="middle">停不下 · 又过不去</text>
    <!-- 两辆车 -->
    <g stroke="#f1f3f5" stroke-width="3">
      <rect x="330" y="360" width="56" height="28" rx="6"/>
      <rect x="560" y="360" width="56" height="28" rx="6"/>
    </g>
    <text x="358" y="345" fill="#f1f3f5" font-size="17" text-anchor="middle">刹不住</text>
    <text x="588" y="345" fill="#f1f3f5" font-size="17" text-anchor="middle">过不去</text>
    <!-- 说明 -->
    <text x="400" y="180" fill="#f1f3f5" font-size="22" font-weight="700">黄灯太短 · 选择变成赌博</text>
    <text x="400" y="230" fill="#f1f3f5" font-size="19" opacity=".8">好的配时，让这段区间彻底消失</text>
    <text x="770" y="560" fill="#f1f3f5" font-size="17" text-anchor="end" opacity=".55">Dilemma Zone · 示意</text>
  </g>
</svg>
