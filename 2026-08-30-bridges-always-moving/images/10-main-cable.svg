<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="ui-sans-serif,'Noto Sans SC',sans-serif">
  <!-- 浅色页用 · 主缆由钢丝束成 -->
  <g fill="none" stroke-linecap="round">
    <!-- 主缆大圆 -->
    <circle cx="400" cy="280" r="170" stroke="#0a0a0b" stroke-width="7"/>
    <!-- 内部钢丝束（螺旋线示意） -->
    <g stroke="#0a0a0b" stroke-width="1.8" opacity=".55">
      <path d="M250 200 Q 400 260 550 200 M240 240 Q 400 310 560 240 M235 285 Q 400 350 565 285 M245 330 Q 400 390 555 330 M270 370 Q 400 420 530 370"/>
      <path d="M300 160 Q 340 280 300 400 M400 120 Q 400 280 400 445 M500 160 Q 460 280 500 400"/>
    </g>
    <!-- 标注 -->
    <text x="620" y="180" fill="#0a0a0b" font-size="20" font-weight="700">27,572 根钢丝</text>
    <text x="620" y="208" fill="#0a0a0b" font-size="17" opacity=".75">钢丝先成股 · 再束成缆</text>
    <path d="M612 190 L 545 220" stroke="#0a0a0b" stroke-width="2" stroke-dasharray="5 6"/>
    <text x="150" y="180" fill="#0a0a0b" font-size="19" opacity=".8">只受拉</text>
    <!-- 底部数字 -->
    <text x="400" y="510" fill="#0a0a0b" font-size="23" text-anchor="middle" font-weight="700">钢丝总长 ≈ 12.9 万 km · 可绕地球三圈</text>
    <text x="770" y="70" fill="#0a0a0b" font-size="17" text-anchor="end" opacity=".55">Golden Gate Main Cable · 示意</text>
  </g>
</svg>
