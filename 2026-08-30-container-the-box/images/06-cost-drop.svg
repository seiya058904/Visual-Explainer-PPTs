<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="ui-sans-serif,'Noto Sans SC',sans-serif">
  <!-- 浅色页用 · 每吨装卸成本 $5.86 → $0.16 -->
  <g fill="none" stroke-linecap="round">
    <line x1="110" y1="480" x2="720" y2="480" stroke="#0a1f3d" stroke-width="3"/>
    <line x1="110" y1="120" x2="110" y2="480" stroke="#0a1f3d" stroke-width="2" opacity=".4"/>
    <text x="95" y="130" fill="#0a1f3d" font-size="20" text-anchor="end" opacity=".7">$/吨</text>
    <!-- 散件柱（高） -->
    <rect x="200" y="140" width="150" height="340" fill="rgba(10,31,61,.8)"/>
    <text x="275" y="112" fill="#0a1f3d" font-size="30" text-anchor="middle" font-weight="700">$5.86</text>
    <text x="275" y="516" fill="#0a1f3d" font-size="22" text-anchor="middle" opacity=".8">散件时代</text>
    <!-- 集装箱柱（几乎看不见，用最小可见高度） -->
    <rect x="480" y="470" width="150" height="10" fill="rgba(10,31,61,.8)"/>
    <path d="M480 452 L 630 452" stroke="#0a1f3d" stroke-width="2" stroke-dasharray="6 7" opacity=".5"/>
    <text x="555" y="420" fill="#0a1f3d" font-size="30" text-anchor="middle" font-weight="700">$0.16</text>
    <text x="555" y="516" fill="#0a1f3d" font-size="22" text-anchor="middle" opacity=".8">集装箱化</text>
    <!-- 下降箭头 -->
    <path d="M370 300 C 410 340, 420 400, 440 445" stroke="#0a1f3d" stroke-width="3.5"/>
    <path d="M428 432 L 444 452 L 450 428" stroke="#0a1f3d" stroke-width="3.5"/>
    <text x="420" y="360" fill="#0a1f3d" font-size="24" font-weight="700">≈36 ×</text>
    <text x="720" y="560" fill="#0a1f3d" font-size="18" text-anchor="end" opacity=".55">估算 · Levinson, The Box (2006) · 1950s 美国港口口径</text>
  </g>
</svg>
