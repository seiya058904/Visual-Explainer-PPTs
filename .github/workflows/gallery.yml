name: Gallery checks
on:
  push:
    branches: [main, feat/visual-explainer-gallery]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: python docs/build/audit-catalog.py
      - run: python -m unittest discover -s docs/build -p 'test_*.py'
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Serve under the production project prefix
        run: |
          mkdir -p .codex/public/Visual-Explainer-PPTs
          cp -a dist/. .codex/public/Visual-Explainer-PPTs/
          python -m http.server 8902 --bind 127.0.0.1 --directory .codex/public > /tmp/gallery-server.log 2>&1 &
      - run: npm run test:site
        env:
          GALLERY_URL: http://127.0.0.1:8902/Visual-Explainer-PPTs/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallery-browser-evidence
          path: .codex/gallery-qa
      - uses: actions/upload-artifact@v4
        with:
          name: gallery-static-site
          path: dist
# Publication intentionally remains disabled until the deck/provenance acceptance
# ledger has been reviewed. This workflow never uploads the repository root.
